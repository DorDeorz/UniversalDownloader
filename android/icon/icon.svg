<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- UniversalDownloader for Android: a play-shaped download arrow landing
       on a tray, circled by an orbit ("universal"). Layers: #background and
       #foreground (Android adaptive icon); the glyph stays inside the
       adaptive icon's safe circle (radius 313 of 1024). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2250"/>
      <stop offset="1" stop-color="#2A1454"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46E3FF"/>
      <stop offset="0.55" stop-color="#8F6BFF"/>
      <stop offset="1" stop-color="#FF5FA2"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46E3FF"/>
      <stop offset="1" stop-color="#FF5FA2"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
  </g>
  <g id="foreground" transform="translate(512 512) scale(0.82) translate(-512 -512)">
    <!-- orbit around the arrow, with a small satellite -->
    <g transform="rotate(-18 512 500)">
      <ellipse cx="512" cy="500" rx="318" ry="112" fill="none" stroke="url(#orbit)" stroke-width="30"/>
      <circle cx="756" cy="428" r="30" fill="#FF5FA2"/>
    </g>
    <!-- arrow: stem plus a rounded, play-like head pointing down; a dark
         rim separates it from the orbit behind -->
    <path d="M452 230 h120 a30 30 0 0 1 30 30 v180 h86 L512 700 L336 440 h86 v-180 a30 30 0 0 1 30 -30 z" fill="none" stroke="#221A52" stroke-width="60" stroke-linejoin="round"/>
    <path d="M452 230 h120 a30 30 0 0 1 30 30 v180 h86 L512 700 L336 440 h86 v-180 a30 30 0 0 1 30 -30 z" fill="url(#arrow)" stroke="url(#arrow)" stroke-width="28" stroke-linejoin="round"/>
    <!-- tray -->
    <rect x="322" y="758" width="380" height="56" rx="28" fill="#FFFFFF" opacity="0.92"/>
  </g>
</svg>
