name: Release

# Builds the Windows installer, installs it on the runner to check that the
# app starts and finds FFmpeg and Deno, then publishes it as a GitHub
# Release. A pushed tag v<version> publishes; a manual run publishes only
# when "publish" is ticked (the tag is then created on the chosen commit).
# Pull requests that change the build are built and tested, never published.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"
      - "UniversalDownloader.spec"
      - "build_app.py"
      - "requirements*.txt"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release (tag v<version from version.py>)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # bin/ffmpeg.exe and bin/ffprobe.exe are Git LFS objects: fetch the
      # real programs, not the pointer files.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version
        id: version
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version.py ($version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies (virtual environment)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      # yt-dlp needs a JavaScript runtime for YouTube's challenges; Deno is
      # the one it enables by default. The app puts bin\ first on PATH.
      - name: Download Deno
        run: |
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP\deno.zip"
          Expand-Archive "$env:RUNNER_TEMP\deno.zip" -DestinationPath bin -Force
          bin\deno.exe --version

      - name: Build the app folder
        run: .venv\Scripts\python build_app.py --onedir --require-deno

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\UniversalDownloader.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Install, start and uninstall on the runner
        run: |
          $setup = "dist\UniversalDownloader-Setup-${{ steps.version.outputs.version }}.exe"
          $dir = "$env:RUNNER_TEMP\uvd"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait
          $exe = "$dir\UniversalDownloader.exe"
          if (-not (Test-Path $exe)) { throw "The installer did not install $exe" }
          & "$dir\_internal\bin\ffmpeg.exe" -version | Select-Object -First 1
          & "$dir\_internal\bin\ffprobe.exe" -version | Select-Object -First 1
          & "$dir\_internal\bin\deno.exe" --version
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "The app exited at startup with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Get-Content "$env:LOCALAPPDATA\UniversalDownloader\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          Start-Sleep -Seconds 2
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "The uninstaller left $exe behind" }

      - name: Checksums
        run: |
          $setup = Get-Item "dist\UniversalDownloader-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Add-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/UniversalDownloader-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/build-info.json

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Universal Video Downloader ${{ steps.version.outputs.version }}
          body_path: installer/release-notes.md
          files: |
            dist/UniversalDownloader-Setup-${{ steps.version.outputs.version }}.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
