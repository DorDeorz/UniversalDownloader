name: Android

# Builds Orbida's Android APK and tests it on an emulator: the app downloads
# a local test video as Video + Audio, as MP3 and trimmed (which runs the
# bundled FFmpeg, ffprobe and QuickJS on Android), goes through YouTube via
# the browser route, and installs an update of itself.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (a PKCS12
# keystore, key alias "orbida") and ANDROID_KEYSTORE_PASSWORD the APK is a
# release build signed with that key, the one every published version must
# carry (Android only installs an update signed like the installed app).
# Without them it is a debug build, fine for CI but not for publishing.
#
# Publishing: .github/workflows/release.yml calls this workflow
# (workflow_call, with the secrets), takes the apk-arm64-v8a artifact and
# publishes it with the Windows installer on the release orbida-v<X.Y.Z>,
# where the app's updater (android/app/self_update.py) finds it; it checks
# the "signed" output first. A manual run with "publish" ticked puts a signed
# test build on a pre-release tagged orbida-test-<run number>, which the
# updater ignores.

on:
  workflow_call:
    outputs:
      signed:
        description: "true when the APK was signed with the project key"
        value: ${{ jobs.apk.outputs.signed }}
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "events.py"
      - "filenames.py"
      - "formats.py"
      - "i18n.py"
      - "locales/**"
      - "logic.py"
      - "media_tools.py"
      - "playlist.py"
      - "results.py"
      - "urls.py"
      - "utils.py"
      - "version.py"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "events.py"
      - "filenames.py"
      - "formats.py"
      - "i18n.py"
      - "locales/**"
      - "logic.py"
      - "media_tools.py"
      - "playlist.py"
      - "results.py"
      - "urls.py"
      - "utils.py"
      - "version.py"
  workflow_dispatch:
    inputs:
      publish:
        description: "Put a signed test build on a pre-release (orbida-test-<run number>)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILDOZER_VERSION: "1.6.0"
  P4A_VERSION: "2026.5.9"

jobs:
  native:
    name: FFmpeg and QuickJS for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: native-tools
          key: native-${{ hashFiles('android/native/**') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" android/native/build_tools.sh native-tools arm64-v8a x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-tools
          path: native-tools
          if-no-files-found: error

  apk:
    name: APK (${{ matrix.arch }})
    needs: native
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a is the APK for phones; x86_64 runs on the CI emulator.
        arch: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-tools
          path: native-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev cmake unzip zip
          python -m pip install "buildozer==$BUILDOZER_VERSION" "python-for-android==$P4A_VERSION" cython setuptools
          # buildozer wants a python-for-android source folder; use the pinned release.
          python -m pip download --no-deps "python-for-android==$P4A_VERSION" -d "$RUNNER_TEMP/p4a-wheel"
          unzip -q "$RUNNER_TEMP"/p4a-wheel/*.whl -d "$RUNNER_TEMP/p4a"
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ matrix.arch }}-${{ env.BUILDOZER_VERSION }}-${{ env.P4A_VERSION }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ matrix.arch }}-${{ env.BUILDOZER_VERSION }}-${{ env.P4A_VERSION }}-
      - name: Build APK
        id: build
        working-directory: android
        env:
          UD_NATIVE_TOOLS_DIR: ${{ github.workspace }}/native-tools
          APP_P4A_SOURCE_DIR: ${{ runner.temp }}/p4a
          APP_ANDROID_ARCHS: ${{ matrix.arch }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python stage.py
          version=$(sed -n 's/^version = //p' buildozer.spec)
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orbida.p12"
            export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/orbida.p12" P4A_RELEASE_KEYALIAS=orbida \
              P4A_RELEASE_KEYSTORE_PASSWD="$KEYSTORE_PASSWORD" P4A_RELEASE_KEYALIAS_PASSWD="$KEYSTORE_PASSWORD"
            yes | buildozer android release
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key in the repository secrets: debug build, not for publishing"
            yes | buildozer android debug
          fi
          rm -f "$RUNNER_TEMP/orbida.p12"
          mkdir -p ../apk
          cp bin/*.apk "../apk/Orbida-$version-android-${{ matrix.arch }}.apk"
      - name: Check the APK carries the tools
        run: |
          unzip -l apk/*.apk | grep -E "lib/${{ matrix.arch }}/lib(ffmpeg|ffprobe|qjs|avcodec|avformat)\.so"
          ls -lh apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: apk/*.apk
          if-no-files-found: error

  emulator:
    name: Emulator test
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: apk-arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make a test video and serve it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          mkdir -p served
          ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=440 \
            -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest served/sample.mp4
          # An "update" for the app to find, download and install: the same APK
          # listed as a newer release, like the GitHub API lists one.
          cp apk/*.apk served/update.apk
          python3 - <<'PY'
          import json, os
          size = os.path.getsize("served/update.apk")
          release = {"tag_name": "orbida-v99.0.0", "draft": False, "prerelease": False, "body": "CI update test",
                     "html_url": "http://10.0.2.2:8000/", "assets": [{
                         "name": "Orbida-99.0.0-android-arm64-v8a.apk", "size": size,
                         "browser_download_url": "http://10.0.2.2:8000/update.apk"}]}
          json.dump([release], open("served/releases.json", "w"))
          PY
          nohup python3 android/range_server.py served 8000 >/dev/null 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            UD_UPDATE_RELEASES=http://10.0.2.2:8000/releases.json bash android/emulator_ui_test.sh apk/*.apk
            bash android/emulator_ui_test.sh apk-arm64/*.apk || echo "::warning::The phone APK failed the UI test under ARM translation"
            bash android/emulator_test.sh apk/*.apk http://10.0.2.2:8000/sample.mp4

  publish:
    name: Publish test build
    needs: [apk, emulator]
    # github.workflow is the caller's name when release.yml calls this one, so
    # its own publish input never starts a test pre-release here.
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Android' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: apk
      - name: Only a signed APK is published
        if: needs.apk.outputs.signed != 'true'
        run: |
          echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets; an APK without the project's key cannot update the app"
          exit 1
      - name: Test build on a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "orbida-test-${{ github.run_number }}" apk/*.apk --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Orbida Android test build ${{ github.run_number }} (not a release)" \
            --notes-file android/release-notes.md
