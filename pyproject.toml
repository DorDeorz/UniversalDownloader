[project]
name = "orbida"
version = "1.2.3"  # keep equal to version.py (tests/test_build.py checks)
description = "Orbida: a video and audio downloader for Windows and Android built on yt-dlp and FFmpeg"
requires-python = ">=3.11"
# Exact pins live in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start with errors that are always bugs (syntax, undefined names, unused imports).
# Widen the rule set once the existing code has been cleaned up step by step.
select = ["E9", "F"]
