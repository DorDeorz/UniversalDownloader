name: Android preview

# Builds the Android preview APK (debug-signed) and tests it on an emulator:
# the app downloads a local test video as Video + Audio, as MP3 and trimmed,
# which runs the bundled FFmpeg, ffprobe and QuickJS on Android.
#
# A manual run with "publish" ticked attaches the APK to a GitHub
# pre-release tagged android-preview-<run number>. That is separate from
# the Windows releases (tags v<version>) and never marked as latest.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "events.py"
      - "filenames.py"
      - "formats.py"
      - "i18n.py"
      - "locales/**"
      - "logic.py"
      - "media_tools.py"
      - "playlist.py"
      - "results.py"
      - "urls.py"
      - "utils.py"
      - "version.py"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "events.py"
      - "filenames.py"
      - "formats.py"
      - "i18n.py"
      - "locales/**"
      - "logic.py"
      - "media_tools.py"
      - "playlist.py"
      - "results.py"
      - "urls.py"
      - "utils.py"
      - "version.py"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as a GitHub pre-release (android-preview-<run number>)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILDOZER_VERSION: "1.6.0"
  P4A_VERSION: "2026.5.9"

jobs:
  native:
    name: FFmpeg and QuickJS for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: native-tools
          key: native-${{ hashFiles('android/native/**') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" android/native/build_tools.sh native-tools arm64-v8a x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-tools
          path: native-tools
          if-no-files-found: error

  apk:
    name: APK (${{ matrix.arch }})
    needs: native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a is the APK for phones; x86_64 runs on the CI emulator.
        arch: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-tools
          path: native-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev cmake unzip zip
          python -m pip install "buildozer==$BUILDOZER_VERSION" "python-for-android==$P4A_VERSION" cython setuptools
          # buildozer wants a python-for-android source folder; use the pinned release.
          python -m pip download --no-deps "python-for-android==$P4A_VERSION" -d "$RUNNER_TEMP/p4a-wheel"
          unzip -q "$RUNNER_TEMP"/p4a-wheel/*.whl -d "$RUNNER_TEMP/p4a"
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ matrix.arch }}-${{ env.BUILDOZER_VERSION }}-${{ env.P4A_VERSION }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ matrix.arch }}-${{ env.BUILDOZER_VERSION }}-${{ env.P4A_VERSION }}-
      - name: Build APK
        working-directory: android
        env:
          UD_NATIVE_TOOLS_DIR: ${{ github.workspace }}/native-tools
          APP_P4A_SOURCE_DIR: ${{ runner.temp }}/p4a
          APP_ANDROID_ARCHS: ${{ matrix.arch }}
        run: |
          python stage.py
          yes | buildozer android debug
          mkdir -p ../apk
          cp bin/*.apk "../apk/UniversalDownloader-android-preview-${{ matrix.arch }}.apk"
      - name: Check the APK carries the tools
        run: |
          unzip -l apk/*.apk | grep -E "lib/${{ matrix.arch }}/lib(ffmpeg|ffprobe|qjs|avcodec|avformat)\.so"
          ls -lh apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: apk/*.apk
          if-no-files-found: error

  emulator:
    name: Emulator test
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: apk-arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make a test video and serve it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          mkdir -p served
          ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=440 \
            -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest served/sample.mp4
          nohup python3 android/range_server.py served 8000 >/dev/null 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash android/emulator_ui_test.sh apk/*.apk
            bash android/emulator_ui_test.sh apk-arm64/*.apk || echo "::warning::The phone APK failed the UI test under ARM translation"
            bash android/emulator_test.sh apk/*.apk http://10.0.2.2:8000/sample.mp4

  publish:
    name: Publish pre-release
    needs: [apk, emulator]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: apk
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-preview-${{ github.run_number }}"
          gh release create "$tag" apk/*.apk --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Android preview ${{ github.run_number }} (not a Windows release)" \
            --notes-file android/release-notes.md
