name: YouTube probe (temporary)

on:
  push:
    branches: [claude/android-prototype-hea08y]
    paths: [".github/workflows/yt-probe.yml", ".github/probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install "yt-dlp[default,curl-cffi]==2026.8.19" yt-dlp-ejs==0.8.0
      - name: Anonymous browser cookies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python .github/probe/browser_cookies.py cookies.txt
      - name: Pass rates
        run: python .github/probe/yt_probe2.py cookies.txt
