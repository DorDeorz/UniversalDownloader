name: Release

# Builds Orbida for Windows (installer) and Android (APK) and publishes both
# in one GitHub Release tagged orbida-v<version> (version from version.py).
# The in-app updaters read the latest such release.
#
# - The Windows job builds the installer, then installs it on the runner to
#   check that the app starts and finds FFmpeg and Deno.
# - The Android job is .github/workflows/android.yml (build and emulator test).
# - A pushed tag orbida-v<version> publishes; a manual run publishes only when
#   "publish" is ticked (the tag is then created on the chosen commit).
#   "delete_android_previews" also removes the old android-preview-* and
#   orbida-test-* pre-releases.
# Pull requests that change the Windows build are built and tested, never published.

on:
  push:
    tags: ["orbida-v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"
      - "Orbida.spec"
      - "build_app.py"
      - "requirements*.txt"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub Release (tag orbida-v<version from version.py>)"
        type: boolean
        default: false
      delete_android_previews:
        description: "Also delete every android-preview-* and orbida-test-* pre-release and its tag"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      # bin/ffmpeg.exe and bin/ffprobe.exe are Git LFS objects: fetch the
      # real programs, not the pointer files.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version
        id: version
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "orbida-v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version.py ($version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies (virtual environment)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-dev.txt

      # yt-dlp needs a JavaScript runtime for YouTube's challenges; Deno is
      # the one it enables by default. The app puts bin\ first on PATH.
      - name: Download Deno
        run: |
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile "$env:RUNNER_TEMP\deno.zip"
          Expand-Archive "$env:RUNNER_TEMP\deno.zip" -DestinationPath bin -Force
          bin\deno.exe --version

      - name: Build the app folder
        run: .venv\Scripts\python build_app.py --onedir --require-deno

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\Orbida.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Install, start and uninstall on the runner
        run: |
          $setup = "dist\Orbida-Setup-${{ steps.version.outputs.version }}.exe"
          $dir = "$env:RUNNER_TEMP\orbida"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait
          $exe = "$dir\Orbida.exe"
          if (-not (Test-Path $exe)) { throw "The installer did not install $exe" }
          & "$dir\_internal\bin\ffmpeg.exe" -version | Select-Object -First 1
          & "$dir\_internal\bin\ffprobe.exe" -version | Select-Object -First 1
          & "$dir\_internal\bin\deno.exe" --version
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "The app exited at startup with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Get-Content "$env:LOCALAPPDATA\Orbida\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          Start-Sleep -Seconds 2
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "The uninstaller left $exe behind" }

      # What the in-app updater does: the running app starts the setup with
      # /SILENT /RELAUNCH=1 and closes; setup replaces it and starts the new copy.
      - name: Update the running app
        run: |
          $setup = (Resolve-Path "dist\Orbida-Setup-${{ steps.version.outputs.version }}.exe").Path
          $dir = "$env:RUNNER_TEMP\orbida-update"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait
          Start-Sleep -Seconds 3
          Get-Process Orbida -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:ORBIDA_SELFTEST_UPDATE = $setup
          $app = Start-Process "$dir\Orbida.exe" -PassThru
          Remove-Item Env:ORBIDA_SELFTEST_UPDATE
          $deadline = (Get-Date).AddSeconds(120)
          $new = $null
          while ((Get-Date) -lt $deadline -and -not $new) {
            Start-Sleep -Seconds 3
            $new = Get-Process Orbida -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $app.Id }
          }
          Get-Content "$env:LOCALAPPDATA\Orbida\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 15
          if (-not $app.HasExited) { throw "The app did not close for the update" }
          if (-not $new) { throw "The app did not start again after the update" }
          $new | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Orbida-Setup-*.exe
            dist/build-info.json

  android:
    name: Android
    # A pull request only checks the Windows build; android.yml runs itself
    # when Android files change.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/android.yml
    # A called workflow gets at most the caller's permissions, and android.yml
    # has a job (its own test pre-release, skipped here) that asks for
    # contents: write; without this the run fails to start.
    permissions:
      contents: write
    # The APK is signed with the project key from the repository secrets
    # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD).
    secrets: inherit

  publish:
    name: Publish the release
    needs: [windows, android]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      # Android installs an update only when it is signed like the installed app.
      - name: Only a signed APK is published
        if: needs.android.outputs.signed != 'true'
        run: |
          echo "::error::The APK is not signed with the project key; add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64-v8a
          path: apk
      - name: Collect the files
        run: |
          apks=(apk/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then echo "Expected one APK, found ${#apks[@]}"; exit 1; fi
          cp "${apks[0]}" "release/Orbida-$VERSION.apk"
          cd release
          test -f "Orbida-Setup-$VERSION.exe"
          sha256sum "Orbida-Setup-$VERSION.exe" "Orbida-$VERSION.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l
      - name: Create the release
        run: |
          gh release create "orbida-v$VERSION" \
            "release/Orbida-Setup-$VERSION.exe" "release/Orbida-$VERSION.apk" \
            release/SHA256SUMS.txt release/build-info.json \
            --target "$GITHUB_SHA" --latest --title "Orbida $VERSION" --notes-file RELEASE_NOTES.md
      - name: Delete the Android preview and test pre-releases
        if: inputs.delete_android_previews
        run: |
          gh release list --limit 500 --json tagName --jq '.[].tagName' | { grep -E '^(android-preview|orbida-test)-' || true; } | while read -r tag; do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
